<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Bases | CLASH ZONE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <a class="brand-logo" href="index.html">
        <img src="https://api.iconify.design/game-icons:barbarian.svg?color=%23fbbf24" alt="Barbarian Logo">
        <span class="brand-text">CLASH ZONE</span>
      </a>
      <div class="header-actions" id="topNavActions"></div>
    </div>
  </header>

  <div class="container">
    <div class="section-header">
      <h2 class="section-title"><i class="fa-solid fa-chess-rook" style="color:var(--gold);"></i> Pro Base Layouts</h2>
      <button class="btn btn-gold" style="font-size: 13px;" onclick="openModal('uploadModal')"><i class="fa-solid fa-plus"></i> Upload Base</button>
    </div>

    <div class="grid" id="baseGrid">
      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?auto=format&fit=crop&w=500&q=80" alt="TH16 Base">
          <span class="card-badge">TH 16 War</span>
        </div>
        <div class="card-body">
          <div class="card-title">Anti 3-Star Pro War Base</div>
          <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="alert('Base Link Copied to Clipboard!')"><i class="fa-solid fa-copy"></i> Copy In-Game Link</button>
        </div>
      </div>

      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=80" alt="TH15 Base">
          <span class="card-badge">TH 15 Trophy</span>
        </div>
        <div class="card-body">
          <div class="card-title">Legend League Hard Core Base</div>
          <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="alert('Base Link Copied to Clipboard!')"><i class="fa-solid fa-copy"></i> Copy In-Game Link</button>
        </div>
      </div>

      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=80" alt="TH14 Farming">
          <span class="card-badge">TH 14 Farm</span>
        </div>
        <div class="card-body">
          <div class="card-title">Vault Anti-Loot Farming Base</div>
          <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="alert('Base Link Copied to Clipboard!')"><i class="fa-solid fa-copy"></i> Copy In-Game Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- UPLOAD MODAL -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('uploadModal')">×</button>
      <h2 style="font-family:'Teko'; color:var(--gold); font-size:28px;"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Pro Layout</h2>

      <div class="form-group" style="margin-top: 15px;">
        <label>Town Hall Level</label>
        <select id="newBaseTH">
          <option>TH 16</option>
          <option>TH 15</option>
          <option>TH 14</option>
          <option>TH 13</option>
        </select>
      </div>
      <div class="form-group">
        <label>Base Type</label>
        <select id="newBaseType">
          <option>Anti 3-Star War Base</option>
          <option>Legend Trophy Base</option>
          <option>Farming Base</option>
        </select>
      </div>
      <div class="form-group">
        <label>In-Game Share Link</label>
        <input type="url" id="newBaseLink" placeholder="https://link.clashofclans.com/...">
      </div>

      <button class="btn btn-gold" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="publishBase()"><i class="fa-solid fa-share-nodes"></i> Publish Base (+50 XP)</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>
    <a href="tournaments.html" class="nav-item">
      <i class="fa-solid fa-trophy"></i>
      <span>Wars</span>
    </a>
    <a href="bases.html" class="nav-item active">
      <i class="fa-solid fa-chess-rook"></i>
      <span>Bases</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <i class="fa-solid fa-chart-simple"></i>
      <span>Ranks</span>
    </a>
    <button class="nav-item" id="bottomProfileBtn" onclick="openAuthModal('login')">
      <i class="fa-solid fa-user"></i>
      <span id="bottomProfileText">Login</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
